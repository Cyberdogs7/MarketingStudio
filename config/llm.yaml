# gpu_offload: true = the GPU manager owns the LLM lifecycle with a NON-DESTRUCTIVE
# probe-first loader (no reload if the model already serves), so a model evicted
# mid-run is reloaded on the next retry. This self-heals LM Studio's evictions.
gpu_offload: true
evict_before_render: true
