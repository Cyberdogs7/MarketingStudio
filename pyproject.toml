[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-studio"
version = "0.1.0"
description = "Local-first UGC ad studio - product photos + direction to finished short-form video"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "httpx",
]

[tool.setuptools]
packages = ["studio", "studio.clients", "studio.compile"]
